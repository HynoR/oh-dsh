# Oh-DSH Web from this checkout. Bind mounts next to this file survive
# container rebuilds and Docker resets. Upgrade by rebuilding the image,
# not `ohdsh update`. Node layout follows the builder's CPU; do not pin it.
#
#   docker compose -f docker/compose.yaml up --build
#
# Host networking: the process binds 127.0.0.1:3080 on the Docker host.
# Behind Nginx, set OH_DSH_TRUSTED_HOSTS to the browser Host (copy
# docker/.env.example to docker/.env, or prefix the compose command) and
# pass `proxy_set_header Host $http_host;`.
#
#   OH_DSH_TRUSTED_HOSTS=dsh.example.com docker compose -f docker/compose.yaml up --build

name: oh-dsh-web

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    environment:
      OH_DSH_UPDATE_CHECK: "0"
      DSH_OH_WEB_OPEN: "0"
      OH_DSH_HOME: /data
      OH_DSH_TRUSTED_HOSTS: ${OH_DSH_TRUSTED_HOSTS:-localhost:3080}
    volumes:
      - ${OH_DSH_HOME_HOST:-./data}:/data
      - ${OH_DSH_WORKSPACE:-./workspace}:/workspace
    working_dir: /workspace
