# Oh-DSH Web from this checkout. Bind mounts next to this file survive
# container rebuilds and Docker resets. Upgrade by rebuilding the image,
# not `ohdsh update`. Build on Linux; the image is linux/amd64.
#
#   docker compose -f docker/compose.yaml up --build
#
# Behind Nginx, set OH_DSH_TRUSTED_HOSTS to the browser Host and pass
# `proxy_set_header Host $host;`. Do not publish 3080 on all interfaces.

name: oh-dsh-web

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      OH_DSH_UPDATE_CHECK: "0"
      DSH_OH_WEB_OPEN: "0"
      OH_DSH_HOME: /data
      OH_DSH_TRUSTED_HOSTS: ${OH_DSH_TRUSTED_HOSTS:-localhost:3080}
    volumes:
      - ${OH_DSH_HOME_HOST:-./data}:/data
      - ${OH_DSH_WORKSPACE:-./workspace}:/workspace
    working_dir: /workspace
